name: SuperiorGenerator
version: 1.0.3
api-version: 26.1.2
author: nivcoo
main: fr.nivcoo.superiorgenerator.SuperiorGenerator
depend: [ SuperiorSkyblock2 ]
softdepend: [ PlaceholderAPI ]
commands:
  generator:
    description: Generator Command
permissions:
  superiorgenerator.commands:
    default: op
    description: command
  superiorgenerator.command.unlock:
    default: op
    description: unlock generator for island
  superiorgenerator.command.select:
    default: op
    description: select generator for island
  superiorgenerator.admin.command.select.other:
    default: op
    description: select generator for another island
